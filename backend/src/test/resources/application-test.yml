spring:
  datasource:
    url: jdbc:h2:mem:helpdesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

jwt:
  secret: test-jwt-secret-placeholder-of-at-least-32-bytes
  expiration-ms: 3600000

server:
  port: 8080
